<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pokémon FireRed Remake</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <div id="pad">
    <div id="dpad">
      <button data-btn="up" class="d up">▲</button>
      <button data-btn="left" class="d left">◀</button>
      <button data-btn="right" class="d right">▶</button>
      <button data-btn="down" class="d down">▼</button>
    </div>
    <div id="mid">
      <button data-btn="select" class="s">SELECT</button>
      <button data-btn="start" class="s">START</button>
    </div>
    <div id="ab">
      <button data-btn="b" class="r b">B</button>
      <button data-btn="a" class="r a">A</button>
    </div>
  </div>
  <div id="help">Arrows: move · Z/Space: A · X/Esc: B (hold to run) · Enter: START · Shift: SELECT</div>
</div>
<script src="js/core.js"></script>
<script src="js/text.js"></script>
<script src="js/gen/font.js"></script>
<script src="js/gen/data.js"></script>
<script src="js/gen/strings.js"></script>
<script src="js/gen/maps.js"></script>
<script src="js/gen/scripts.js"></script>
<script src="js/pokemon.js"></script>
<script src="js/battle.js"></script>
<script src="js/field.js"></script>
<script src="js/vm.js"></script>
<script src="js/game.js"></script>
<script src="js/menus.js"></script>
<script src="js/gen/audio.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
